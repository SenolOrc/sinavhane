[package]
name = "fizik-sinav"
version = "1.3.0"
description = "Sınavhane"
edition = "2021"

[lib]
name = "fizik_sinav_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
zeroize = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Yalnız macOS: yazdırma kâğıdını A4'e sabitlemek için.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
